<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation: Dead Drop — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#0d1117;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--amber:#d4a017;--amber2:#f0c040;--red:#f85149;--green:#3fb950;--blue:#388bfd;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'VT323',monospace;padding:20px 16px 60px;min-height:100vh;}
  .container{max-width:820px;margin:0 auto;}

  .header{text-align:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .title{font-family:'Press Start 2P',monospace;font-size:clamp(9px,2vw,12px);color:var(--amber);letter-spacing:2px;margin-bottom:6px;line-height:1.8;}
  .subtitle{font-size:18px;color:var(--dim);letter-spacing:3px;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;}
  .panel-title{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--dim);letter-spacing:3px;margin-bottom:14px;}

  input[type="password"],select{font-family:'VT323',monospace;font-size:20px;border-radius:4px;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:5px 8px;outline:none;transition:border-color .15s;}
  input:focus,select:focus{border-color:var(--amber);}

  button{font-family:'VT323',monospace;font-size:18px;border-radius:4px;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:6px 12px;cursor:pointer;transition:all .15s;outline:none;}
  button:hover{border-color:var(--amber);color:var(--amber);}

  .btn-primary{font-family:'Press Start 2P',monospace;font-size:9px;background:var(--amber);border-color:var(--amber);color:#000;padding:12px 24px;letter-spacing:2px;width:100%;}
  .btn-primary:hover{background:var(--amber2);border-color:var(--amber2);color:#000;}
  .btn-primary:disabled{background:#333;border-color:#444;color:#666;cursor:not-allowed;}

  .btn-load{font-family:'Press Start 2P',monospace;font-size:7px;padding:9px 14px;letter-spacing:1px;border-color:var(--blue);color:var(--blue);background:rgba(56,139,253,0.08);}
  .btn-load:hover{background:rgba(56,139,253,0.18);color:var(--blue);border-color:var(--blue);}

  .btn-danger{font-family:'Press Start 2P',monospace;font-size:7px;padding:8px 14px;background:var(--panel2);border-color:var(--red);color:var(--red);width:auto;letter-spacing:1px;}
  .btn-danger:hover{background:rgba(248,81,73,0.1);}

  .token-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .token-row input{flex:1;min-width:180px;}
  .token-tag{font-family:'Press Start 2P',monospace;font-size:6px;border-radius:3px;padding:3px 6px;display:none;}
  .token-tag.saved{color:var(--green);background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.3);display:inline-block;}

  .week-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .week-pips{display:flex;gap:5px;}
  .pip{width:10px;height:10px;border-radius:50%;background:var(--border);border:1px solid var(--dim);cursor:pointer;transition:all .15s;}
  .pip.done{background:var(--dim);border-color:var(--dim);}
  .pip.active{background:var(--amber);border-color:var(--amber);box-shadow:0 0 5px var(--amber);}

  .team-table{width:100%;border-collapse:collapse;}
  .team-table th{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);letter-spacing:2px;padding:0 8px 10px;text-align:left;border-bottom:1px solid var(--border);}
  .team-table td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
  .team-table tr:last-child td{border-bottom:none;}
  .color-dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,0.2);vertical-align:middle;margin-right:5px;}
  .team-name-cell{font-size:19px;white-space:nowrap;}
  .codename-cell{font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
  .codename-cell.redacted{text-decoration:line-through;}

  .result-btns{display:flex;gap:4px;}
  .result-btn{font-family:'Press Start 2P',monospace;font-size:7px;padding:5px 8px;letter-spacing:1px;cursor:pointer;transition:all .15s;border-radius:4px;}
  .result-btn.win{border-color:var(--green);color:var(--green);background:rgba(63,185,80,0.06);}
  .result-btn.win.active{background:rgba(63,185,80,0.2);box-shadow:0 0 5px rgba(63,185,80,0.3);}
  .result-btn.tie{border-color:var(--amber);color:var(--amber);background:rgba(212,160,23,0.06);}
  .result-btn.tie.active{background:rgba(212,160,23,0.2);box-shadow:0 0 5px rgba(212,160,23,0.2);}
  .result-btn.loss{border-color:var(--dim);color:var(--dim);background:rgba(139,148,158,0.06);}
  .result-btn.loss.active{background:rgba(139,148,158,0.15);}

  .delta{font-family:'Press Start 2P',monospace;font-size:7px;min-width:40px;text-align:center;color:var(--dim);}
  .delta.pos{color:var(--green);}
  .total-sp{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--dim);min-width:60px;text-align:right;white-space:nowrap;}

  .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .preview-card{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:8px 10px;}
  .prev-name{font-size:16px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prev-sp{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);margin-bottom:3px;}
  .prev-bar{height:3px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
  .prev-fill{height:100%;border-radius:2px;min-width:2px;}

  .status-bar{border-radius:6px;padding:11px 16px;font-size:18px;text-align:center;letter-spacing:1px;display:none;margin-bottom:14px;}
  .status-bar.loading{display:block;background:rgba(56,139,253,0.1);border:1px solid var(--blue);color:var(--blue);}
  .status-bar.success{display:block;background:rgba(63,185,80,0.1);border:1px solid var(--green);color:var(--green);}
  .status-bar.error{display:block;background:rgba(248,81,73,0.1);border:1px solid var(--red);color:var(--red);}
  .status-bar.info{display:block;background:rgba(212,160,23,0.08);border:1px solid rgba(212,160,23,0.3);color:var(--amber);}

  .footer-row{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);justify-content:flex-end;align-items:center;}
  .footer-note{flex:1;font-size:15px;color:var(--dim);}
</style>
</head>
<body>
<div class="container">

<script>
const REPO_OWNER="0ssaris";
const REPO_NAME="sdfhl-kart";
const FILE_PATH="index.html";
const BRANCH="fall_2026";
const MAX_SPACES=27;
const STORAGE_TOKEN="sdfhl_admin_token";
const STORAGE_DRAFT="sdfhl_op_draft_v1";

const TEAMS=[
  {name:"Neon",    codename:"The Nick Who Gloved Me",       color:"#ffff00"},
  {name:"Charcoal",codename:"REDACTED",                     color:"#555555",redacted:true},
  {name:"Grey",    codename:"Greyed Out",                   color:"#757070"},
  {name:"Brown",   codename:"Brownfinger",                  color:"#7f6000"},
  {name:"Teal",    codename:"Double Do' 7",                 color:"#008080"},
  {name:"Blue",    codename:"Karsino Royale",               color:"#b4c6e7"},
  {name:"Pink",    codename:"Mason Impossible",             color:"#ef2fc6"},
  {name:"White",   codename:"Snowbody Dubs It Better",      color:"#e8e8e8"},
  {name:"Maroon",  codename:"Maroonraker",                  color:"#800000"},
  {name:"Green",   codename:"coVert AgedGents",             color:"#00b050"},
];

let state={
  week:1,
  teams:TEAMS.map(t=>({...t,spaces:0,wins:0,ties:0,losses:0,weekResult:null}))
};

function calcDelta(r){return r==="win"?3:r==="tie"?1:r==="loss"?0:0;}

function saveDraft(){localStorage.setItem(STORAGE_DRAFT,JSON.stringify({...state,savedAt:Date.now()}));}
function loadDraft(){
  try{
    const raw=localStorage.getItem(STORAGE_DRAFT);
    if(!raw)return false;
    const d=JSON.parse(raw);
    state=d;
    document.getElementById("weekSelect").value=state.week;
    return d.savedAt;
  }catch{return false;}
}

window.addEventListener("DOMContentLoaded",()=>{
  const token=localStorage.getItem(STORAGE_TOKEN);
  if(token){document.getElementById("tokenInput").value=token;document.getElementById("tokenTag").className="token-tag saved";}
  renderAll();
  const dt=loadDraft();
  if(dt){renderAll();const d=new Date(dt);showStatus("info",`Draft loaded — ${d.toLocaleDateString()} ${d.toLocaleTimeString()}`);setTimeout(()=>document.getElementById("statusBar").style.display="none",4000);}
});

function renderAll(){renderWeekPips();renderTable();renderPreview();}

function renderWeekPips(){
  const w=state.week;
  document.getElementById("weekPips").innerHTML=Array.from({length:9},(_,i)=>{
    const cls=i<w-1?"pip done":i===w-1?"pip active":"pip";
    return`<div class="${cls}" onclick="setWeek(${i+1})"></div>`;
  }).join("");
}

function updateWeek(){state.week=parseInt(document.getElementById("weekSelect").value);saveDraft();renderWeekPips();renderPreview();}
function setWeek(w){state.week=w;document.getElementById("weekSelect").value=w;saveDraft();renderWeekPips();renderPreview();}

function setResult(name,result){
  const t=state.teams.find(t=>t.name===name);
  if(!t)return;
  t.weekResult=result;
  saveDraft();renderTable();renderPreview();
}

function renderTable(){
  document.getElementById("teamTableBody").innerHTML=state.teams.map(t=>{
    const res=t.weekResult;
    const delta=calcDelta(res);
    const newTotal=t.spaces+delta;
    const rBtns=["win","tie","loss"].map(r=>
      `<button class="result-btn ${r}${res===r?" active":""}" onclick="setResult('${t.name}','${r}')">${r==="win"?"W":r==="tie"?"T":"L"}</button>`
    ).join("");
    const deltaStr=delta>0?`+${delta}`:"—";
    const deltaCls=`delta${delta>0?" pos":""}`;
    return`<tr>
      <td class="team-name-cell"><span class="color-dot" style="background:${t.color}"></span>${t.name}</td>
      <td class="codename-cell${t.redacted?" redacted":""}">${t.codename}</td>
      <td><div class="result-btns">${rBtns}</div></td>
      <td><span class="${deltaCls}">${deltaStr}</span></td>
      <td><span class="total-sp">${newTotal}/${MAX_SPACES}</span></td>
    </tr>`;
  }).join("");
}

function renderPreview(){
  const projected=[...state.teams].map(t=>({
    ...t,projSpaces:t.spaces+calcDelta(t.weekResult)
  })).sort((a,b)=>b.projSpaces-a.projSpaces);
  document.getElementById("preview").innerHTML=projected.map(t=>{
    const pct=Math.min(100,Math.round((t.projSpaces/MAX_SPACES)*100));
    return`<div class="preview-card">
      <div class="prev-name"><span class="color-dot" style="background:${t.color}"></span>${t.name}</div>
      <div class="prev-sp">${t.projSpaces} pts</div>
      <div class="prev-bar"><div class="prev-fill" style="width:${pct}%;background:${t.color}"></div></div>
    </div>`;
  }).join("");
}

async function loadFromGitHub(){
  const token=getToken();if(!token)return showStatus("error","Paste your GitHub token first.");
  showStatus("loading","Loading from GitHub...");
  try{
    const res=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?ref=${BRANCH}`,
      {headers:{Authorization:`token ${token}`,Accept:"application/vnd.github.v3+json"}});
    if(!res.ok)throw new Error(`GitHub returned ${res.status}`);
    const data=await res.json();
    const content=decodeURIComponent(escape(atob(data.content.replace(/\n/g,""))));
    parseOpData(content);renderAll();saveDraft();
    showStatus("success","✓ Loaded from GitHub.");
  }catch(e){showStatus("error",e.message);}
}

function parseOpData(html){
  const match=html.match(/const OPERATION_DATA\s*=\s*\{([\s\S]*?)\};/);
  if(!match)return;
  const block=match[1];
  const wm=block.match(/week:\s*(\d+)/);
  if(wm){state.week=parseInt(wm[1]);document.getElementById("weekSelect").value=state.week;}
  const tm=[...block.matchAll(/\{[^}]+name:"([^"]+)"[^}]+spaces:(\d+)[^}]+wins:(\d+)[^}]+ties:(\d+)[^}]+losses:(\d+)[^}]*\}/g)];
  tm.forEach(m=>{
    const t=state.teams.find(t=>t.name===m[1]);
    if(!t)return;
    t.spaces=parseInt(m[2]);t.wins=parseInt(m[3]);t.ties=parseInt(m[4]);t.losses=parseInt(m[5]);t.weekResult=null;
  });
}

async function pushToGitHub(){
  const token=getToken();if(!token)return showStatus("error","Paste your GitHub token first.");
  document.getElementById("pushBtn").disabled=true;
  showStatus("loading","Pushing to GitHub...");
  try{
    const getRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?ref=${BRANCH}`,
      {headers:{Authorization:`token ${token}`,Accept:"application/vnd.github.v3+json"}});
    if(!getRes.ok)throw new Error(`Could not fetch file: ${getRes.status}`);
    const getData=await getRes.json();
    const sha=getData.sha;
    let content=decodeURIComponent(escape(atob(getData.content.replace(/\n/g,""))));

    // Apply week results
    state.teams.forEach(t=>{
      const delta=calcDelta(t.weekResult);
      t.spaces+=delta;
      if(t.weekResult==="win")t.wins++;
      else if(t.weekResult==="tie")t.ties++;
      else if(t.weekResult==="loss")t.losses++;
      t.weekResult=null;
    });

    const newBlock=buildBlock();
    const updated=content.replace(/const OPERATION_DATA\s*=\s*\{[\s\S]*?\};/,newBlock);
    if(updated===content)throw new Error("Could not locate OPERATION_DATA block in file.");

    const putRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{
      method:"PUT",
      headers:{Authorization:`token ${token}`,"Content-Type":"application/json",Accept:"application/vnd.github.v3+json"},
      body:JSON.stringify({message:`Operation Dead Drop — Week ${state.week} update`,content:btoa(unescape(encodeURIComponent(updated))),sha,branch:BRANCH}),
    });
    if(!putRes.ok){const e=await putRes.json();throw new Error(e.message||`Push failed: ${putRes.status}`);}

    state.week=Math.min(9,state.week+1);
    document.getElementById("weekSelect").value=state.week;
    saveDraft();renderAll();
    showStatus("success",`✓ Week ${state.week-1} pushed! Week bumped to ${state.week}. Live in ~60s.`);
  }catch(e){showStatus("error",e.message);}
  finally{document.getElementById("pushBtn").disabled=false;}
}

function buildBlock(){
  const teamsStr=state.teams.map(t=>{
    const redactedStr=t.redacted?", redacted:true":"";
    return`    { name:"${t.name}", codename:"${t.codename}", color:"${t.color}", spaces:${t.spaces},  wins:${t.wins}, ties:${t.ties}, losses:${t.losses}${redactedStr} }`;
  }).join(",\n");
  return`const OPERATION_DATA = {
  week: ${state.week},
  totalWeeks: 9,

  // spaces : cumulative points (W=+3, T=+1, L=+0)
  // wins / ties / losses : season record for display
  // redacted : shows codename with strikethrough
  teams: [
${teamsStr},
  ],
};`;
}

function getToken(){
  const t=document.getElementById("tokenInput").value.trim();
  if(t){localStorage.setItem(STORAGE_TOKEN,t);document.getElementById("tokenTag").className="token-tag saved";}
  return t;
}
function showStatus(type,msg){
  const b=document.getElementById("statusBar");
  b.className=`status-bar ${type}`;b.textContent=msg;b.style.display="block";
  if(type==="success")setTimeout(()=>{b.style.display="none";},5000);
}
function hardReset(){
  if(!confirm("Reset ALL data? Cannot be undone."))return;
  localStorage.removeItem(STORAGE_DRAFT);
  state={week:1,teams:TEAMS.map(t=>({...t,spaces:0,wins:0,ties:0,losses:0,weekResult:null}))};
  document.getElementById("weekSelect").value=1;
  renderAll();showStatus("info","Full reset complete.");
}
</script>

<div class="header">
  <div class="title">⚙️ OPERATION: DEAD DROP — ADMIN</div>
  <div class="subtitle">PUSH UPDATES TO LIVE SITE</div>
</div>

<div id="statusBar" class="status-bar"></div>

<div class="panel">
  <div class="panel-title">🔑 GITHUB ACCESS</div>
  <div class="token-row">
    <input type="password" id="tokenInput" placeholder="Paste GitHub token..." autocomplete="off">
    <button class="btn-load" onclick="loadFromGitHub()">⬇ LOAD FROM GITHUB</button>
    <span class="token-tag" id="tokenTag"></span>
  </div>
  <div style="margin-top:7px;font-size:15px;color:var(--dim)">Token stored locally only. Never uploaded.</div>
</div>

<div class="panel">
  <div class="panel-title">📅 CURRENT WEEK</div>
  <div class="week-row">
    <span style="font-size:20px;color:var(--dim)">Week</span>
    <select id="weekSelect" onchange="updateWeek()">
      <option>1</option><option>2</option><option>3</option><option>4</option>
      <option>5</option><option>6</option><option>7</option><option>8</option><option>9</option>
    </select>
    <div class="week-pips" id="weekPips"></div>
    <span style="font-size:14px;color:var(--dim)">(auto-advances after push)</span>
  </div>
</div>

<div class="panel">
  <div class="panel-title">🕵️ WEEKLY RESULTS — WIN +3 · TIE +1 · LOSS +0</div>
  <div style="overflow-x:auto">
    <table class="team-table">
      <thead><tr>
        <th>TEAM</th><th>CODENAME</th><th>RESULT</th><th>+PTS</th><th>NEW TOTAL</th>
      </tr></thead>
      <tbody id="teamTableBody"></tbody>
    </table>
  </div>
</div>

<div class="panel">
  <div class="panel-title">👁 PROJECTED STANDINGS</div>
  <div class="preview-grid" id="preview"></div>
</div>

<button class="btn-primary" id="pushBtn" onclick="pushToGitHub()">🚀 PUSH TO LIVE SITE</button>

<div class="footer-row">
  <div class="footer-note">Draft auto-saves on every change.</div>
  <button class="btn-danger" onclick="hardReset()">⚠ FULL RESET</button>
</div>

</div>
</body>
</html>
