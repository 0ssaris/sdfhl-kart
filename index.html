<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDFHL Grand Prix</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a14; --panel:#12122a; --border:#2a2a4a; --road:#1e1e38;
    --text:#e8e8f0; --dim:#6a6a9a; --accent:#ff6b00; --accent2:#ffe600;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'VT323',monospace;padding:20px 16px;min-height:100vh;}
  .container{max-width:820px;margin:0 auto;}

  /* HEADER */
  .header{text-align:center;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--border);}
  .title{font-family:'Press Start 2P',monospace;font-size:clamp(12px,3vw,18px);color:var(--accent);text-shadow:3px 3px 0 #7a1c00;margin-bottom:8px;line-height:1.7;}
  .week-display{font-size:26px;color:var(--dim);letter-spacing:4px;}
  .week-pips{display:flex;justify-content:center;gap:6px;margin-top:8px;}
  .pip{width:10px;height:10px;border-radius:50%;background:var(--border);border:1px solid var(--dim);}
  .pip.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 5px var(--accent);}

  /* TRACK SECTION */
  .track-section{background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;}
  .section-label{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--dim);letter-spacing:3px;margin-bottom:12px;}
  .track-scroll{overflow-x:auto;}

  .track-grid{
    display:grid;
    grid-template-columns:repeat(7,72px);
    grid-template-rows:repeat(7,72px);
    gap:3px;
    width:fit-content;
    margin:0 auto;
  }

  .track-cell{
    background:var(--road);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:4px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;
    padding:3px 2px 4px;
    overflow:hidden;
  }
  .track-cell.start-cell{
    background-image:linear-gradient(45deg,#fff 25%,transparent 25%),linear-gradient(-45deg,#fff 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff 75%),linear-gradient(-45deg,transparent 75%,#fff 75%);
    background-size:8px 8px;
    background-position:0 0,0 4px,4px -4px,-4px 0;
    background-color:#111;
    border:2px solid #fff;
  }
  .track-cell.item-box-cell{background:#1a1400;border:1px solid var(--accent2);box-shadow:inset 0 0 8px rgba(255,230,0,0.12);}
  .track-cell.banana-cell{background:#1a1500;border:1px solid #a08000;}

  .track-inner{
    grid-row:2/7;grid-column:2/7;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:6px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:5px;padding:10px;
  }
  .inner-week{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--dim);letter-spacing:2px;}
  .inner-title{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--accent2);letter-spacing:2px;margin-bottom:2px;}
  .inner-row{font-size:16px;display:flex;align-items:center;justify-content:center;gap:5px;width:100%;}
  .inner-stat{font-family:'Press Start 2P',monospace;font-size:5px;color:var(--dim);white-space:nowrap;}

  .kart-stack{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:22px;align-items:flex-end;}
  .kart-badge{
    width:20px;height:20px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
    font-family:'Press Start 2P',monospace;font-size:5px;
    color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,0.8);
    flex-shrink:0;cursor:default;
    transition:transform .15s;
  }
  .kart-badge:hover{transform:scale(1.2);position:relative;z-index:5;}
  .cell-label{font-family:'Press Start 2P',monospace;font-size:6px;color:rgba(255,255,255,0.25);line-height:1;margin-top:2px;}
  .cell-label.start-lbl{color:rgba(255,255,255,0.8);font-size:14px;}
  .cell-label.item-lbl{color:rgba(255,230,0,0.8);font-size:14px;}
  .cell-label.banana-lbl{font-size:14px;}

  /* STANDINGS */
  .standings-section{background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;}
  .standing-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
  .standing-row:last-child{border-bottom:none;}
  .pos{font-family:'Press Start 2P',monospace;font-size:8px;width:28px;text-align:center;flex-shrink:0;color:var(--dim);}
  .pos.p1{color:#ffd700;} .pos.p2{color:#c0c0c0;} .pos.p3{color:#cd7f32;}
  .team-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,0.2);}
  .team-name-text{flex:1;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;}
  .lap-badge{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--accent2);background:rgba(255,230,0,0.1);border:1px solid rgba(255,230,0,0.3);border-radius:3px;padding:2px 5px;flex-shrink:0;white-space:nowrap;}
  .track-bar-bg{flex:2;height:12px;background:rgba(255,255,255,0.07);border-radius:6px;overflow:hidden;min-width:50px;}
  .track-bar-fill{height:100%;border-radius:6px;transition:width .4s;}
  .space-label{font-size:17px;color:var(--dim);width:64px;text-align:right;flex-shrink:0;white-space:nowrap;}
  .items-held{font-size:18px;min-width:44px;text-align:right;flex-shrink:0;letter-spacing:-1px;}

  /* LEGEND */
  .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;padding:12px 16px;}
  .legend-label{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--dim);letter-spacing:2px;margin-bottom:4px;grid-column:1/-1;}
  .legend-item{font-size:16px;color:var(--dim);display:flex;align-items:center;gap:6px;}

  @media(max-width:520px){
    .team-name-text{font-size:17px;}
    .space-label{font-size:14px;width:52px;}
    .items-held{font-size:15px;min-width:36px;}
  }
</style>
</head>
<body>
<div class="container"><div id="app"></div></div>
<script>
// ╔══════════════════════════════════════════════════════╗
// ║  ✏️  EDIT THIS BLOCK EACH WEEK                       ║
// ╚══════════════════════════════════════════════════════╝
const RACE_DATA = {
  week: 2,
  totalWeeks: 9,

  // totalSpaces = cumulative spaces earned all season
  // items: use these emoji — "🍄" "⭐" "🐢" "🔴" "🔵" "🍌" "⚡"
  teams: [
    { name: "Blue",   color: "#b4c6e7", totalSpaces: 11, items: [] },
    { name: "Pink",   color: "#ef2fc6", totalSpaces: 13, items: [] },
    { name: "Purple",   color: "#7030a0", totalSpaces: 13, items: [] },
    { name: "Brown",   color: "#7f6000", totalSpaces: 10, items: [] },
    { name: "Orange",   color: "#f86308", totalSpaces: 7, items: [] },
    { name: "Red",   color: "#ff0000", totalSpaces: 5, items: [] },
    { name: "Green",   color: "#00b050", totalSpaces: 3, items: [] },
    { name: "Grey",   color: "#757070", totalSpaces: 18, items: [] },
    { name: "Neon",   color: "#ffff00", totalSpaces: 10, items: [] },
  ],

  // Track positions (1-23) where banana peels are active
  bananaPeels: [],
};
// ╚══════════════════════════════════════════════════════╝

const LAP = 24;

// TRACK LAYOUT: [CSS grid-row, CSS grid-col, space 0-23, isCorner/itemBox]
// Track runs clockwise: bottom-left START → right → top → left → back
const TRACK_LAYOUT = [
  // Bottom row (left→right): row 7
  [7,1,0,true],[7,2,1,false],[7,3,2,false],[7,4,3,false],[7,5,4,false],[7,6,5,false],[7,7,6,true],
  // Right col (bottom→top, no corners): rows 6→2, col 7
  [6,7,7,false],[5,7,8,false],[4,7,9,false],[3,7,10,false],[2,7,11,false],
  // Top row (right→left): row 1
  [1,7,12,true],[1,6,13,false],[1,5,14,false],[1,4,15,false],[1,3,16,false],[1,2,17,false],
  // Left col (top→bottom, no bottom corner): rows 1→6, col 1
  [1,1,18,true],[2,1,19,false],[3,1,20,false],[4,1,21,false],[5,1,22,false],[6,1,23,false],
];

function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function render(){
  const{week,totalWeeks,teams,bananaPeels}=RACE_DATA;

  // Karts by track position
  const kartsAt={};
  teams.forEach(t=>{
    const pos=t.totalSpaces%LAP;
    if(!kartsAt[pos])kartsAt[pos]=[];
    kartsAt[pos].push(t);
  });

  const sorted=[...teams].sort((a,b)=>b.totalSpaces-a.totalSpaces);

  // Week pips
  const pips=Array.from({length:totalWeeks},(_,i)=>
    `<div class="pip${i<week?' active':''}"></div>`).join('');

  // Track cells
  const cells=TRACK_LAYOUT.map(([gr,gc,sp,isCorner])=>{
    const isStart=sp===0;
    const hasBanana=bananaPeels.includes(sp);
    let cls='track-cell';
    if(isStart)cls+=' start-cell';
    else if(hasBanana)cls+=' banana-cell';
    else if(isCorner)cls+=' item-box-cell';

    const karts=(kartsAt[sp]||[]).map(t=>
      `<div class="kart-badge" style="background:${t.color}" title="${t.name}">${initials(t.name)}</div>`
    ).join('');

    let lbl,lblCls='cell-label';
    if(isStart){lbl='🏁';lblCls+=' start-lbl';}
    else if(hasBanana){lbl='🍌';lblCls+=' banana-lbl';}
    else if(isCorner){lbl='❓';lblCls+=' item-lbl';}
    else lbl=sp;

    return`<div class="${cls}" style="grid-row:${gr};grid-column:${gc}">
      <div class="kart-stack">${karts}</div>
      <div class="${lblCls}">${lbl}</div>
    </div>`;
  }).join('');

  // Inner panel – top 3
  const top3=sorted.slice(0,3).map((t,i)=>{
    const laps=Math.floor(t.totalSpaces/LAP);
    const pos=t.totalSpaces%LAP;
    return`<div class="inner-row">${['🥇','🥈','🥉'][i]}
      <span style="color:${t.color}">${t.name}</span>
      <span class="inner-stat">L${laps}+${pos}</span></div>`;
  }).join('');

  // Standings
  const rows=sorted.map((t,i)=>{
    const p=i+1;
    const pCls=p===1?'pos p1':p===2?'pos p2':p===3?'pos p3':'pos';
    const laps=Math.floor(t.totalSpaces/LAP);
    const lapPos=t.totalSpaces%LAP;
    const pct=Math.min(100,Math.round((lapPos/LAP)*100));
    const lapBadge=laps>0?`<div class="lap-badge">${laps} LAP${laps>1?'S':''}</div>`:'';
    const itemStr=t.items.length>0?t.items.join(' '):'—';
    return`<div class="standing-row">
      <div class="${pCls}">${ordinal(p)}</div>
      <div class="team-dot" style="background:${t.color}"></div>
      <div class="team-name-text">${t.name}</div>
      ${lapBadge}
      <div class="track-bar-bg"><div class="track-bar-fill" style="width:${pct}%;background:${t.color}"></div></div>
      <div class="space-label">Sp.${t.totalSpaces}</div>
      <div class="items-held">${itemStr}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML=`
    <div class="header">
      <div class="title">🏁 SDFHL GRAND PRIX</div>
      <div class="week-display">WEEK ${week} / ${totalWeeks}</div>
      <div class="week-pips">${pips}</div>
    </div>

    <div class="track-section">
      <div class="section-label">📍 RACE TRACK — LAP LENGTH: ${LAP} SPACES</div>
      <div class="track-scroll">
        <div class="track-grid">
          ${cells}
          <div class="track-inner">
            <div class="inner-week">WEEK ${week} / ${totalWeeks}</div>
            <div class="inner-title">🏆 LEADERS</div>
            ${top3||'<div class="inner-stat">RACE NOT STARTED</div>'}
          </div>
        </div>
      </div>
    </div>

    <div class="standings-section">
      <div class="section-label">📊 STANDINGS — SORTED BY TOTAL SPACES</div>
      ${rows}
    </div>

    <div class="legend">
      <div class="legend-label">TRACK & ITEMS</div>
      <div class="legend-item">🏁 Start / Lap</div>
      <div class="legend-item">❓ Item Box (corners)</div>
      <div class="legend-item">🍌 Banana Peel</div>
      <div class="legend-item">🍄 Mushroom +5</div>
      <div class="legend-item">⭐ Star</div>
      <div class="legend-item">🐢 Green Shell −4</div>
      <div class="legend-item">🔴 Red Shell −6</div>
      <div class="legend-item">🔵 Blue Shell −10</div>
      <div class="legend-item">⚡ Lightning −4 all</div>
    </div>`;
}
render();
</script>
</body>
</html>
