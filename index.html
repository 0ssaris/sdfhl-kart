<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDFHL Grand Prix</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a14;
    --panel: #12122a;
    --border: #2a2a4a;
    --road: #1e1e38;
    --item-box-bg: #1a1400;
    --item-box-border: #f5c518;
    --text: #e8e8f0;
    --dim: #6a6a9a;
    --accent: #ff6b00;
    --accent2: #ffe600;
    --finish-light: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'VT323', monospace;
    padding: 24px 16px;
    min-height: 100vh;
  }

  .container { max-width: 820px; margin: 0 auto; }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--border);
    position: relative;
  }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3vw, 20px);
    color: var(--accent);
    text-shadow: 3px 3px 0 #7a1c00, 6px 6px 0 rgba(0,0,0,0.4);
    margin-bottom: 10px;
    line-height: 1.6;
  }

  .week-display {
    font-size: 28px;
    color: var(--dim);
    letter-spacing: 4px;
  }

  .week-pips {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }

  .pip {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    border: 1px solid var(--dim);
  }

  .pip.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }

  /* ── WINNER BANNER ── */
  .winner-banner {
    background: linear-gradient(135deg, #1a1200 0%, #2a2000 100%);
    border: 2px solid var(--item-box-border);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 20px;
    text-align: center;
  }

  .winner-banner-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--item-box-border);
    letter-spacing: 3px;
    margin-bottom: 12px;
  }

  .winner-entry {
    font-size: 24px;
    padding: 3px 0;
    letter-spacing: 2px;
  }

  /* ── TRACK ── */
  .track-section {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 18px 16px 14px;
    margin-bottom: 20px;
    overflow-x: auto;
  }

  .section-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--dim);
    letter-spacing: 3px;
    margin-bottom: 14px;
  }

  .track-wrapper { min-width: 580px; }

  /* Karts hover row */
  .karts-row {
    display: flex;
    height: 64px;
    margin-bottom: 3px;
  }

  .kart-cell {
    flex: 1;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    justify-content: flex-start;
    gap: 2px;
    padding-bottom: 3px;
  }

  .kart-badge {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: #fff;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.7);
    flex-shrink: 0;
    cursor: default;
    transition: transform 0.15s;
  }

  .kart-badge:hover { transform: scale(1.2); z-index: 10; position: relative; }

  /* Road row */
  .road-row { display: flex; }

  .road-cell {
    flex: 1;
    height: 48px;
    background: var(--road);
    border: 1px solid rgba(255,255,255,0.07);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-width: 0;
    transition: background 0.2s;
  }

  .road-cell.start-cell {
    background: #0d1f0d;
    border-color: #2ecc71;
  }

  .road-cell.item-box-cell {
    background: var(--item-box-bg);
    border-color: var(--item-box-border);
    box-shadow: inset 0 0 10px rgba(245,197,24,0.15);
  }

  .road-cell.banana-cell {
    background: #1a1500;
    border-color: #a08000;
  }

  .road-cell.finish-cell {
    /* Checkered finish */
    background-color: #111;
    background-image:
      linear-gradient(45deg, #fff 25%, transparent 25%),
      linear-gradient(-45deg, #fff 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #fff 75%),
      linear-gradient(-45deg, transparent 75%, #fff 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
    border-color: #fff;
    border-width: 2px;
  }

  .cell-icon {
    font-size: 18px;
    line-height: 1;
  }

  .cell-num {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: rgba(255,255,255,0.25);
    white-space: nowrap;
  }

  .cell-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 5px;
    color: rgba(255,255,255,0.55);
    text-align: center;
    line-height: 1.3;
    white-space: nowrap;
  }

  /* Road dashes between cells */
  .road-row .road-cell:not(:last-child)::after {
    content: '';
    position: absolute;
    right: -1px;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
  }

  /* ── STANDINGS ── */
  .standings-section {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 18px 16px;
    margin-bottom: 20px;
  }

  .standing-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .standing-row:last-child { border-bottom: none; }

  .pos {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    width: 30px;
    text-align: center;
    flex-shrink: 0;
    color: var(--dim);
  }

  .pos.p1 { color: #ffd700; }
  .pos.p2 { color: #c0c0c0; }
  .pos.p3 { color: #cd7f32; }

  .team-color-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.25);
  }

  .team-name-text {
    flex: 1;
    font-size: 22px;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 80px;
  }

  .track-bar-bg {
    flex: 2;
    height: 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 7px;
    overflow: hidden;
    min-width: 80px;
    position: relative;
  }

  .track-bar-fill {
    height: 100%;
    border-radius: 7px;
    min-width: 4px;
    transition: width 0.4s ease;
  }

  .space-label {
    font-size: 18px;
    color: var(--dim);
    width: 56px;
    text-align: right;
    flex-shrink: 0;
  }

  .items-held {
    font-size: 20px;
    min-width: 48px;
    text-align: right;
    letter-spacing: -1px;
    flex-shrink: 0;
  }

  /* ── LEGEND ── */
  .legend {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .legend-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--dim);
    letter-spacing: 2px;
    margin-bottom: 8px;
    grid-column: 1 / -1;
  }

  .legend-item {
    font-size: 16px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 500px) {
    .team-name-text { font-size: 18px; }
    .space-label { font-size: 15px; width: 44px; }
    .items-held { font-size: 16px; min-width: 36px; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║   ✏️  EDIT THIS BLOCK EACH WEEK — nothing else needs to change ║
// ╚══════════════════════════════════════════════════════════════╝

const RACE_DATA = {

  week: 1,         // Current week (1–9)
  totalWeeks: 9,

  //
  // TEAMS — update name, space, and items each week.
  //
  // color   : team hex color (pick one per team and keep it all season)
  // space   : total spaces earned so far (0 = not moved yet)
  // items   : items currently held — use these emoji exactly:
  //           "🍄" Mushroom  "⭐" Star     "🐢" Green Shell
  //           "🔴" Red Shell "🔵" Blue Shell "🍌" Banana Peel  "⚡" Lightning
  //
  teams: [
    { name: "Blue",   color: "#b4c6e7", space: 3, items: [] },
    { name: "Pink",   color: "#ef2fc6", space: 0, items: [] },
    { name: "Purple",   color: "#7030a0", space: 0, items: [] },
    { name: "Brown",   color: "#7f6000", space: 3, items: [] },
    { name: "Orange",   color: "#f86308", space: 1, items: [] },
    { name: "Red",   color: "#ff0000", space: 0, items: [] },
    { name: "Green",   color: "#00b050", space: 0, items: [] },
    { name: "Grey",   color: "#757070", space: 3, items: [] },
    { name: "Yellow",   color: "#ffff00", space: 0, items: [] },
  ],

  // Spaces where banana peels are currently placed on the track.
  bananaPeels: [],

  // Teams that have crossed the finish line, in order of finish.
  finishedTeams: [],

};

// ╔══════════════════════════════════════════════════════════════╗
// ║   🚫 DO NOT EDIT BELOW THIS LINE                            ║
// ╚══════════════════════════════════════════════════════════════╝

const TRACK_LENGTH   = 20;
const ITEM_BOX_SPACES = [4, 8, 12, 16];

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function ordinal(n) {
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function render() {
  const { week, totalWeeks, teams, bananaPeels, finishedTeams } = RACE_DATA;

  // Build kart lookup by space
  const kartsAt = {};
  teams.forEach(t => {
    const s = Math.min(t.space, TRACK_LENGTH);
    if (!kartsAt[s]) kartsAt[s] = [];
    kartsAt[s].push(t);
  });

  // Sorted standings
  const sorted = [...teams].sort((a, b) => b.space - a.space);

  let html = '';

  // ── Header ──
  const pips = Array.from({ length: totalWeeks }, (_, i) =>
    `<div class="pip${i < week ? ' active' : ''}"></div>`
  ).join('');

  html += `
    <div class="header">
      <div class="title">🏁 SDFHL GRAND PRIX</div>
      <div class="week-display">WEEK ${week} / ${totalWeeks}</div>
      <div class="week-pips">${pips}</div>
    </div>`;

  // ── Winner Banner ──
  if (finishedTeams.length > 0) {
    const medals = ['🥇','🥈','🥉'];
    const entries = finishedTeams.map((name, i) =>
      `<div class="winner-entry">${medals[i] || (i+1)+'.'} ${name}</div>`
    ).join('');
    html += `
      <div class="winner-banner">
        <div class="winner-banner-title">🏆 RACE RESULTS 🏆</div>
        ${entries}
      </div>`;
  }

  // ── Track ──
  // Build kart badges HTML for each cell
  function kartBadgesFor(spaceIndex) {
    const here = kartsAt[spaceIndex] || [];
    const show = here.slice(0, 4);
    const extra = here.length - show.length;
    let out = show.map(t =>
      `<div class="kart-badge" style="background:${t.color}" title="${t.name}">${initials(t.name)}</div>`
    ).join('');
    if (extra > 0) out += `<div class="kart-badge" style="background:#444">+${extra}</div>`;
    return out;
  }

  // Build cell classes + icons for the road
  function roadCell(s) {
    const isStart  = s === 0;
    const isFinish = s === TRACK_LENGTH;
    const isBox    = ITEM_BOX_SPACES.includes(s);
    const isBanana = bananaPeels.includes(s);

    let cls = 'road-cell';
    if (isFinish) cls += ' finish-cell';
    else if (isStart) cls += ' start-cell';
    else if (isBox) cls += ' item-box-cell';
    else if (isBanana) cls += ' banana-cell';

    let inner = '';
    if (isFinish) {
      inner = `<div class="cell-label">FINISH</div>`;
    } else if (isStart) {
      inner = `<div class="cell-label">START</div>`;
    } else {
      if (isBanana) inner += `<div class="cell-icon">🍌</div>`;
      else if (isBox) inner += `<div class="cell-icon">❓</div>`;
      inner += `<div class="cell-num">${s}</div>`;
    }

    return `<div class="${cls}">${inner}</div>`;
  }

  // Cells 0..TRACK_LENGTH
  const cellIndices = Array.from({ length: TRACK_LENGTH + 1 }, (_, i) => i);

  const kartsRowCells = cellIndices.map(s =>
    `<div class="kart-cell">${kartBadgesFor(s)}</div>`
  ).join('');

  const roadRowCells = cellIndices.map(s => roadCell(s)).join('');

  html += `
    <div class="track-section">
      <div class="section-label">📍 RACE TRACK</div>
      <div class="track-wrapper">
        <div class="karts-row">${kartsRowCells}</div>
        <div class="road-row">${roadRowCells}</div>
      </div>
    </div>`;

  // ── Standings ──
  const standingRows = sorted.map((team, i) => {
    const pos = i + 1;
    const posClass = pos === 1 ? 'pos p1' : pos === 2 ? 'pos p2' : pos === 3 ? 'pos p3' : 'pos';
    const pct = Math.min(100, Math.round((Math.min(team.space, TRACK_LENGTH) / TRACK_LENGTH) * 100));
    const itemStr = team.items.length > 0 ? team.items.join(' ') : '—';

    return `
      <div class="standing-row">
        <div class="${posClass}">${ordinal(pos)}</div>
        <div class="team-color-dot" style="background:${team.color}"></div>
        <div class="team-name-text">${team.name}</div>
        <div class="track-bar-bg">
          <div class="track-bar-fill" style="width:${pct}%;background:${team.color}"></div>
        </div>
        <div class="space-label">Sp.${team.space}</div>
        <div class="items-held">${itemStr}</div>
      </div>`;
  }).join('');

  html += `
    <div class="standings-section">
      <div class="section-label">📊 STANDINGS</div>
      ${standingRows}
    </div>`;

  // ── Legend ──
  html += `
    <div class="legend">
      <div class="legend-label">ITEMS</div>
      <div class="legend-item">❓ Item Box</div>
      <div class="legend-item">🍌 Banana Peel</div>
      <div class="legend-item">🍄 Mushroom +2</div>
      <div class="legend-item">⭐ Star</div>
      <div class="legend-item">🐢 Green Shell −1</div>
      <div class="legend-item">🔴 Red Shell −2</div>
      <div class="legend-item">🔵 Blue Shell −3</div>
      <div class="legend-item">⚡ Lightning −1 all</div>
    </div>`;

  document.getElementById('app').innerHTML = html;
}

render();
</script>
</body>
</html>
